name: インスタに投稿する

on:
  schedule:
    - cron: "50 10 * * 1,3,5" # 月・水・金 19:50(日本時間)。数分〜数十分おくれることがある
  workflow_dispatch:
    inputs:
      dry_run:
        description: "確認だけ(投稿しない)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: 承認済みの1本の画像を投稿用に整える
        run: python -m src.prepare
      - name: 画像を公開の置き場所に保存する
        if: env.DRY_RUN == ''
        run: |
          git config user.name "carousel-bot"
          git config user.email "carousel-bot@users.noreply.github.com"
          git add slides
          git diff --cached --quiet || git commit -m "投稿用の画像を追加"
          git push
      - name: 投稿する
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python -m src.publish
